version: 2

models:
  - name: stg_orders
    description: "Cleansed order events with calculated transit and delay days."
    columns:
      - name: order_id
        description: "Primary key for orders"
        tests:
          - unique
          - not_null
      - name: order_status
        description: "Status of the order"
        tests:
          - not_null
          - accepted_values:
              values: ['delivered', 'shipped', 'processing', 'canceled']

  - name: stg_order_items
    description: "Line-level purchase item details"
    columns:
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: warehouse_id
        tests:
          - not_null
      - name: price
        tests:
          - not_null

  - name: stg_inventory
    description: "Daily warehouse inventory position snapshots"
    columns:
      - name: snapshot_date
        tests:
          - not_null
      - name: warehouse_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: stock_on_hand
        tests:
          - not_null
