version: 2

models:
  - name: dim_warehouses
    description: "Fulfillment center master dimensions."
    columns:
      - name: warehouse_id
        tests:
          - unique
          - not_null
      - name: warehouse_name
        tests:
          - not_null
      - name: region
        tests:
          - not_null

  - name: fct_delivery_performance
    description: "Aggregated warehouse delivery KPIs including on-time delivery rates."
    columns:
      - name: warehouse_id
        tests:
          - not_null
      - name: on_time_delivery_rate_pct
        tests:
          - not_null

  - name: fct_stockout_risks
    description: "Real-time stockout risk scores, days of supply, and reorder recommendations."
    columns:
      - name: warehouse_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: days_of_supply
        tests:
          - not_null
      - name: recommended_reorder_qty
        tests:
          - not_null
      - name: stockout_alert_status
        tests:
          - not_null
          - accepted_values:
              values: ['CRITICAL_STOCKOUT', 'HIGH_IMMINENT_STOCKOUT', 'MODERATE_SAFETY_BREACH', 'LOW_REORDER_TRIGGERED', 'HEALTHY']
